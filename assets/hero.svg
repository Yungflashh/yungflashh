<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="David Adenusi. I ship products people actually use.">
  <defs>
    
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" >
    <stop offset="0" stop-color="#ff8c42"/>
    <stop offset="0.5" stop-color="#ff3d81"/>
    <stop offset="1" stop-color="#7c5cff"/>
  </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8c42"/><stop offset="0.35" stop-color="#ff3d81"/>
      <stop offset="0.5" stop-color="#ffffff"/><stop offset="0.65" stop-color="#ff3d81"/><stop offset="1" stop-color="#7c5cff"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="420" rx="26"/></clipPath>
    <style>
      .pre { white-space: pre; }
      .blob { animation: drift 18s ease-in-out infinite alternate; }
      .b2 { animation-duration: 23s; animation-delay: -6s; }
      .b3 { animation-duration: 27s; animation-delay: -12s; }
      @keyframes drift { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(90px,-40px) scale(1.15); } 100% { transform: translate(-60px,50px) scale(0.92); } }
      .gridmove { animation: grid 8s linear infinite; }
      @keyframes grid { to { transform: translate(40px,40px); } }
      .rise { animation: rise 0.9s cubic-bezier(.2,.8,.2,1) backwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
      .tick { animation: tick 12.8s ease-in-out infinite; }
      @keyframes tick { 0% { opacity: 0; transform: translateY(10px); } 3%, 22% { opacity: 1; transform: none; } 25%, 100% { opacity: 0; transform: translateY(-10px); } }
      .spin { transform-origin: 975px 205px; animation: spin 20s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .pulse { transform-origin: 975px 205px; animation: pulse 3.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .55; } 50% { transform: scale(1.12); opacity: .9; } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="#07090f"/>
    <g opacity="0.75">
      <circle class="blob" cx="260" cy="120" r="170" fill="#ff8c42" filter="url(#blur)" opacity="0.45"/>
      <circle class="blob b2" cx="760" cy="330" r="190" fill="#ff3d81" filter="url(#blur)" opacity="0.35"/>
      <circle class="blob b3" cx="1050" cy="80" r="160" fill="#7c5cff" filter="url(#blur)" opacity="0.45"/>
    </g>
    <g class="gridmove"><rect x="-40" y="-40" width="1280" height="500" fill="url(#grid)"/></g>

    <g class="rise" style="animation-delay:.1s">
      <rect x="72" y="62" width="250" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.07)"/>
      <circle cx="92" cy="78" r="5" fill="#2dd4bf"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="106" y="83" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#eef1f7">shipping from Lagos, NG</text>
    </g>

    <g class="rise" style="animation-delay:.35s">
      <text x="70" y="160" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#eef1f7" letter-spacing="-1.5">Hi, I'm David.</text>
    </g>
    <g class="rise" style="animation-delay:.6s">
      <text x="70" y="232" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="url(#shine)" letter-spacing="-1.5">I ship what people use.</text>
    </g>

    <g class="rise" style="animation-delay:.95s">
    <g class="tick" style="animation-delay:0.0s">
      <text x="72" y="304" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#8a94a8">
        <tspan fill="#2dd4bf">▸ </tspan><tspan fill="#eef1f7" font-weight="700">Roomie</tspan><tspan dx="12">find a roommate you can actually live with</tspan>
      </text>
    </g>
    <g class="tick" style="animation-delay:3.2s" opacity="0">
      <text x="72" y="304" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#8a94a8">
        <tspan fill="#2dd4bf">▸ </tspan><tspan fill="#eef1f7" font-weight="700">SharpLook</tspan><tspan dx="12">book your barber or stylist in two taps</tspan>
      </text>
    </g>
    <g class="tick" style="animation-delay:6.4s" opacity="0">
      <text x="72" y="304" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#8a94a8">
        <tspan fill="#2dd4bf">▸ </tspan><tspan fill="#eef1f7" font-weight="700">VendorSpot</tspan><tspan dx="12">120+ endpoints, one marketplace for local vendors</tspan>
      </text>
    </g>
    <g class="tick" style="animation-delay:9.6s" opacity="0">
      <text x="72" y="304" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#8a94a8">
        <tspan fill="#2dd4bf">▸ </tspan><tspan fill="#eef1f7" font-weight="700">GadgetVault</tspan><tspan dx="12">check a phone is legit before you pay for it</tspan>
      </text>
    </g></g>

    <g class="rise" style="animation-delay:1.2s" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
      <text x="72" y="362" fill="#8a94a8">
        <tspan fill="#ff8c42" font-weight="700">5,933</tspan> contributions this year  <tspan fill="rgba(255,255,255,0.07)">/</tspan>
        <tspan fill="#ff3d81" font-weight="700">371</tspan> of 371 days active  <tspan fill="rgba(255,255,255,0.07)">/</tspan>
        full-stack · mobile · founder<tspan class="blink" fill="#2dd4bf"> ▌</tspan>
      </text>
    </g>

    <circle class="pulse" cx="975" cy="205" r="58" fill="url(#g)" opacity="0.6" filter="url(#blur)"/>
    
    <g class="spin" style="animation-duration:14s;">
      <circle cx="975" cy="205" r="92" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.2"/>
      <circle cx="975" cy="205" r="92" fill="none" stroke="url(#g)" stroke-width="1.4" stroke-dasharray="83 497" stroke-linecap="round" opacity="0.9"/>
      <circle cx="1067.0" cy="205.0" r="5" fill="#ff8c42" filter="url(#glow)"/><circle cx="883.0" cy="205.0" r="5" fill="#ff8c42" filter="url(#glow)"/>
    </g>
    
    <g class="spin" style="animation-duration:22s;animation-direction:reverse;">
      <circle cx="975" cy="205" r="132" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.2"/>
      <circle cx="975" cy="205" r="132" fill="none" stroke="url(#g)" stroke-width="1.4" stroke-dasharray="119 713" stroke-linecap="round" opacity="0.9"/>
      <circle cx="1041.0" cy="319.3" r="5" fill="#ff3d81" filter="url(#glow)"/><circle cx="909.0" cy="90.7" r="5" fill="#ff3d81" filter="url(#glow)"/>
    </g>
    
    <g class="spin" style="animation-duration:32s;">
      <circle cx="975" cy="205" r="172" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.2"/>
      <circle cx="975" cy="205" r="172" fill="none" stroke="url(#g)" stroke-width="1.4" stroke-dasharray="155 929" stroke-linecap="round" opacity="0.9"/>
      <circle cx="889.0" cy="354.0" r="5" fill="#7c5cff" filter="url(#glow)"/><circle cx="1061.0" cy="56.0" r="5" fill="#7c5cff" filter="url(#glow)"/>
    </g>
    <circle cx="975" cy="205" r="46" fill="#0c111c" stroke="url(#g)" stroke-width="2"/>
    <text x="975" y="217" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="34" font-weight="800" fill="url(#g)">&lt;/&gt;</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="26" fill="none" stroke="rgba(255,255,255,0.08)"/>
</svg>
